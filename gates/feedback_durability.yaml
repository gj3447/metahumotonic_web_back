# ooptdd Red artifact — what we expect to OBSERVE when feedback is *durably* stored.
#
# Written independent of the code: the store is the judge, not save()'s return value.
# `save()` returns a record id even when Mongo silently fell back to in-memory, so a
# return-value test is green-and-blind. This gate reads the emitted trace back and
# positively asserts the DURABLE write happened.
#
#   green : feedback_received == 1  AND  feedback_durably_stored == 1
#   RED   : Mongo dropped → feedback_received == 1 but feedback_durably_stored == 0
#           (local fail-soft mode may return 200 accepted; production strict mode
#            returns 503, while this independent gate still proves the write itself)
#
# KG: project_metahumotonic_web_integrate_core_dev_tech_2026_07_13
cid_env: OOPTDD_CID
service: mhb.web_back
expect:
  - event: feedback_received
    op: "=="
    count: 1
  - event: feedback_durably_stored
    op: "=="
    count: 1
