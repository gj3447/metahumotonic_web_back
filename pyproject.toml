[project]
name = "metahumotonic-web-back"
version = "0.9.0"
description = "Backend API for metahumotonic-web — live KG stats + feedback intake (사도 #4 비행기맨 7군단장 정전 surface)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.26",
    "motor>=3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fakeredis>=2.26",
]

[project.urls]
Homepage = "https://metahumotonic.com"
Repository = "https://github.com/gj3447/metahumotonic_web_back"
Issues = "https://github.com/gj3447/metahumotonic_web_back/issues"

[project.scripts]
mhb-mcp = "app.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# _vendor/test_ooptdd_vendor_drift.py = the vendored ooptdd integrity guard (sha256
# vs manifest); include it so CI RED-s if the vendored core is tampered/lagged.
testpaths = ["tests", "_vendor/test_ooptdd_vendor_drift.py"]

# ooptdd (측정 layer / positive-TDD) — vendored self-contained at _vendor/ooptdd.
# The gate tests use the library API directly (no pip install / plugin needed).
# In prod, set MHB_OOPTDD_OO_URL + OOPTDD_OO_PASSWORD to ship trace to OpenObserve.
[tool.ooptdd]
backend = "memory"     # default: zero-infra in-process store (CI/offline)
service = "mhb.web_back"
verify = "warn"        # off | warn | strict — never overrides your assert by default

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
