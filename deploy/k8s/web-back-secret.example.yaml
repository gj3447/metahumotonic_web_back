# Template — real secret is created imperatively on the cluster, NOT committed.
# Create with:
#   kubectl create secret generic web-back-secrets -n infra \
#     --from-literal=neo4j-password='<neo4j pw>' \
#     --from-literal=mongo-uri='mongodb://<user>:<pw>@mongodb.data.svc.cluster.local:27017/?authSource=admin' \
#     --from-literal=kg-read-key='<read key>' \
#     --from-literal=kg-write-key='<write key>'
# Generate the proxy keys with:
#   python3 -c "import secrets; print('mhk_read_'+secrets.token_urlsafe(32)); print('mhk_write_'+secrets.token_urlsafe(32))"
apiVersion: v1
kind: Secret
metadata:
  name: web-back-secrets
  namespace: infra
type: Opaque
stringData:
  neo4j-password: "REDACTED"
  mongo-uri: "mongodb://USER:PASSWORD@mongodb.data.svc.cluster.local:27017/?authSource=admin"
  redis-url: "redis://:PASSWORD@redis.data.svc.cluster.local:6379/0"
  # KG Cypher proxy keys — unset → /api/kg/{read,write} return 503 (disabled)
  kg-read-key: "REDACTED"
  kg-write-key: "REDACTED"
