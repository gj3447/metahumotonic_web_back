# RETIRED 2026-08-08 — HISTORICAL EVIDENCE ONLY. DO NOT APPLY.
#
# This manifest targets the former dgx-worker Deployment and image 0.9.0. The
# live backend is two Docker containers on Proxmox VM100, reached by a
# selectorless Service and manually managed EndpointSlices. Applying this file
# would mix the retired and current ownership models.
#
# Canonical operations: ../../docs/OPERATIONS_VM100.md
# metahumotonic_web_back — former k8s manifests (namespace: infra)
# Former deploy: pushed to in-cluster registry (192.168.0.23:30500).
# Additive: a NEW Deployment + Service + IngressRoute for PathPrefix(/api).
# The live landing-astro-subpages route (/theories /explore /domains /_astro /legacy)
# is untouched — /api is currently unserved, so this can only add, never break.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-back
  namespace: infra
  labels: { app: web-back }
spec:
  # PROM16 C4: 2 replicas (now safe — rate limit is Redis-shared). Both pinned
  # to dgx-worker (image lives in that node's containerd; we avoid a GPU-node
  # containerd restart). Survives pod crash + gives zero-downtime rollouts;
  # node failure remains a SPOF (acceptable per OQ2 for a personal site).
  replicas: 2
  selector:
    matchLabels: { app: web-back }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: web-back }
    spec:
      # Pinned to dgx-worker: image is imported into that node's containerd
      # (k8s.io ns) directly — the in-cluster registry's certs.d plain-http
      # config isn't honored by kubelet, so we skip the registry pull.
      nodeSelector:
        kubernetes.io/hostname: dgx-worker
      # PROM16 C3: let in-flight requests drain before SIGTERM; preStop holds
      # the pod in Terminating long enough for Traefik to deregister it.
      terminationGracePeriodSeconds: 60
      containers:
        - name: web-back
          image: 192.168.0.23:30500/metahumotonic-web-back:0.9.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 8"] }
          ports:
            - containerPort: 8000
          env:
            # Live KG (Neo4j) + persistent feedback (MongoDB), in-cluster (data ns).
            # Both still degrade gracefully if the dep is unreachable.
            - { name: MHB_NEO4J_LIVE, value: "true" }
            # Canonical KG moved to Proxmox data-01 on 2026-07-19.
            - { name: MHB_NEO4J_URI, value: "bolt://192.168.0.25:7687" }
            - { name: MHB_NEO4J_FALLBACK_URIS, value: "" }
            - { name: MHB_NEO4J_USER, value: "neo4j" }
            - name: MHB_NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: web-back-secrets, key: neo4j-password } }
            - name: MHB_MONGO_URI
              valueFrom: { secretKeyRef: { name: web-back-secrets, key: mongo-uri } }
            - { name: MHB_MONGO_DB, value: "metahumotonic" }
            - { name: MHB_MONGO_FEEDBACK_COLLECTION, value: "web_feedback" }
            # Never acknowledge public feedback unless Mongo confirmed the write.
            - { name: MHB_FEEDBACK_REQUIRE_DURABLE, value: "true" }
            # Optional: when absent, the internal feedback inbox is disabled.
            - name: MHB_FEEDBACK_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  { name: web-back-secrets, key: feedback-admin-key, optional: true }
            # PROM16 C2: distributed rate limit (in-cluster Redis, data ns)
            - name: MHB_REDIS_URL
              valueFrom: { secretKeyRef: { name: web-back-secrets, key: redis-url } }
            # KG Cypher proxy keys — unset secret → /api/kg/{read,write} = 503.
            # optional:true so a missing key disables the proxy instead of
            # crash-looping the pod.
            - name: MHB_KG_READ_KEY
              valueFrom:
                secretKeyRef:
                  { name: web-back-secrets, key: kg-read-key, optional: true }
            - name: MHB_KG_WRITE_KEY
              valueFrom:
                secretKeyRef:
                  { name: web-back-secrets, key: kg-write-key, optional: true }
            - { name: MHB_CORS_ORIGINS, value: "https://metahumotonic.com,https://www.metahumotonic.com" }
            # PROM16 C6 observability on; Turnstile secret optional (set to enable)
            - { name: MHB_METRICS_ENABLED, value: "true" }
            - { name: MHB_LOG_JSON, value: "true" }
            # behind Traefik/cloudflared → trust forwarded client-IP headers
            - { name: MHB_TRUST_PROXY, value: "true" }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }   # PROM16 C5: dependency-aware
            initialDelaySeconds: 3
            periodSeconds: 10
          # Mongo/Redis degrade gracefully, but their driver connection timeout can
          # delay the first HTTP listener. Do not let liveness kill a healthy
          # fail-soft startup before it has had a chance to bind the port.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet: { path: /health, port: 8000 }   # liveness = process only
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web-back
  namespace: infra
  labels: { app: web-back }
spec:
  selector: { app: web-back }
  ports:
    - port: 8000
      targetPort: 8000
---
# PROM16 C4: keep 1 pod available during voluntary disruptions (node drain).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-back
  namespace: infra
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: web-back }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-back-api
  namespace: infra
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: (Host(`metahumotonic.com`) || Host(`www.metahumotonic.com`) || Host(`bhgman.iptime.org`)) && (PathPrefix(`/api/stats`) || PathPrefix(`/api/domains`) || PathPrefix(`/api/skills`) || PathPrefix(`/api/research`) || PathPrefix(`/api/feedback`) || PathPrefix(`/api/kg`) || PathPrefix(`/api/mcp`))
      priority: 200
      services:
        - name: web-back
          port: 8000
---
# HTTPS (websecure) — public traffic arrives on :443; mirror of landing-astro-subpages-tls.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-back-api-tls
  namespace: infra
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: (Host(`metahumotonic.com`) || Host(`www.metahumotonic.com`)) && (PathPrefix(`/api/stats`) || PathPrefix(`/api/domains`) || PathPrefix(`/api/skills`) || PathPrefix(`/api/research`) || PathPrefix(`/api/feedback`) || PathPrefix(`/api/kg`) || PathPrefix(`/api/mcp`))
      priority: 200
      services:
        - name: web-back
          port: 8000
  tls:
    secretName: metahumotonic-wildcard-tls
